services:
  database:
    image: postgres:18-alpine
    container_name: bookstore-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - '${DB_PORT}:5432'

    volumes:
      - bookstore_pgdata:/var/lib/postgresql

volumes:
  bookstore_pgdata:
